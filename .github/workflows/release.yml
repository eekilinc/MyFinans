name: Build and Release MyFinans Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint and Build Frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Prepare Keystore for Signing
        working-directory: frontend/android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Loaded keystore from secrets."
          elif [ ! -f release.keystore ]; then
            echo "Generating build keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias myfinans -keyalg RSA -keysize 2048 -validity 10000 -storepass myfinans -keypass myfinans -dname "CN=MyFinans, OU=Mobile, O=MyFinans, C=TR"
          fi

      - name: Build Android Release and Debug APK
        working-directory: frontend/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'myfinans' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'myfinans' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'myfinans' }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Verify Release APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v12.0.0}"
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "MyFinans-${VERSION}.apk"
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "MyFinans-${VERSION}-debug.apk"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myfinans-android-apks
          path: |
            MyFinans-*.apk
            frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MyFinans ${{ github.ref_name || 'v12.0.0' }} - Final Sürüm"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MyFinans-*.apk
            frontend/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
